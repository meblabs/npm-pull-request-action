name: "NpmPullRequest"
description: "GitHub action for MEBlabs pull requests in npm projects"

inputs:
  prettier:
    description: "Check and format code with Prettier"
    required: false
    default: "true"
  eslint:
    description: "Check code with ESLint and reviewdog"
    required: false
    default: "true"
  test:
    description: "Run the configured npm test script"
    required: false
    default: "true"
  test-script:
    required: false
    description: "A custom npm script to run tests"
    default: "test"
  test-args:
    required: false
    description: "Arguments appended after `--` to the test script. Defaults to the Jest CLI flags that produce the report consumed by the publish step. Set to an empty string when your custom test-script does not accept these flags (the Jest report is then skipped)."
    default: "--ci --json --outputFile=jest-results.json"
  audit:
    description: "Run npm audit fix --package-lock-only and commit package-lock.json changes before tests"
    required: false
    default: "true"
  audit-level:
    description: "Minimum npm audit level used by npm audit fix: low, moderate, high, critical"
    required: false
    default: "high"
  token:
    description: "Personal access token used by reviewdog to comment on pull requests"
    required: false
  github-token:
    description: "Token used for checkout push and Jest report comments"
    required: false
  checkout:
    description: "Flag to indicate whether the repo should be checked out"
    required: false
    default: "true"
  node-version:
    description: "Pick the node version to use [20.x, 22.x, ...]"
    required: false
    default: "22.x"
  bot_name:
    description: "Bot username used for automatic commits"
    required: false
    default: "MeblabsBot"
  bot_email:
    description: "Bot email used for automatic commits"
    required: false
    default: "github@meblabs.com"

outputs:
  prettier-changed:
    description: "true if Prettier changed files and an automatic commit was pushed"
    value: ${{ steps.quality_outputs.outputs.prettier-changed }}
  audit-changed:
    description: "true if npm audit changed package-lock.json and an automatic commit was pushed"
    value: ${{ steps.quality_outputs.outputs.audit-changed }}
  current-head-sha:
    description: "Current local HEAD SHA at the end of the action"
    value: ${{ steps.quality_outputs.outputs.current-head-sha }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.checkout == 'true' }}
      name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ inputs.token }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit

    - if: ${{ inputs.prettier == 'true' }}
      name: Run Prettier
      shell: bash
      run: npm run format

    - if: ${{ inputs.prettier == 'true' }}
      name: Check for Prettier changes
      shell: bash
      id: prettier
      run: |
        echo "changes=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.audit == 'true' }}
      name: Run npm audit lockfile fix
      shell: bash
      id: audit
      env:
        NPM_AUDIT_LEVEL: ${{ inputs.audit-level }}
      run: |
        set -euo pipefail

        echo "changes=false" >> "$GITHUB_OUTPUT"

        if [[ ! -f package-lock.json ]]; then
          echo "No package-lock.json found. Skipping npm audit lockfile fix."
          exit 0
        fi

        package_json_before="${RUNNER_TEMP:-/tmp}/package.json.before"
        cp package.json "$package_json_before"

        npm audit fix --package-lock-only --audit-level="${NPM_AUDIT_LEVEL}" || true

        if ! cmp -s package.json "$package_json_before"; then
          echo "npm audit fix modified package.json. This is not allowed for automatic lockfile remediation." >&2
          git checkout -- package.json package-lock.json
          exit 1
        fi

        if ! git diff --quiet -- package-lock.json; then
          echo "changes=true" >> "$GITHUB_OUTPUT"
        fi

    - if: ${{ steps.prettier.outputs.changes == 'true' || steps.audit.outputs.changes == 'true' }}
      name: Commit automatic changes
      shell: bash
      env:
        BOT_NAME: ${{ inputs.bot_name }}
        BOT_EMAIL: ${{ inputs.bot_email }}
        PUSH_TOKEN: ${{ inputs.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail

        git config user.name "$BOT_NAME"
        git config user.email "$BOT_EMAIL"

        git add --all

        if git diff --cached --quiet; then
          echo "No automatic changes to commit."
          exit 0
        fi

        git commit -m "chore: apply automatic formatting and lockfile fixes"

        # Checkout runs with persist-credentials: false, so push with an explicit
        # token-authenticated remote. Token comes from env (masked in logs) and is
        # not written to .git/config.
        git push \
          "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:${HEAD_REF}"

    - if: ${{ steps.prettier.outputs.changes == 'true' || steps.audit.outputs.changes == 'true' }}
      name: Report automatic commit
      shell: bash
      run: |
        echo "An automatic commit was pushed by this action."
        echo "Tests and downstream security checks must run in the next workflow execution on the new commit."

    - if: ${{ inputs.eslint == 'true' && steps.prettier.outputs.changes != 'true' && steps.audit.outputs.changes != 'true' }}
      name: Run ESLint
      # reviewdog/* is not in the ref-pin allowlist, so it is hash-pinned.
      uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
      with:
        reporter: github-pr-review
        eslint_flags: ". --ext .js,.jsx,.mjs,.cjs"
        github_token: ${{ inputs.token }}

    - if: ${{ inputs.test == 'true' && steps.prettier.outputs.changes != 'true' && steps.audit.outputs.changes != 'true' }}
      name: Run Jest
      shell: bash
      env:
        JEST_JUNIT_OUTPUT: junit.xml
        TEST_SCRIPT: ${{ inputs.test-script }}
        TEST_ARGS: ${{ inputs.test-args }}
      continue-on-error: true
      run: |
        # Word-splitting of TEST_ARGS is intentional: it is a list of CLI flags.
        read -ra extra_args <<< "$TEST_ARGS"
        if [[ ${#extra_args[@]} -gt 0 ]]; then
          npm run "$TEST_SCRIPT" -- "${extra_args[@]}"
        else
          npm run "$TEST_SCRIPT"
        fi

    - if: ${{ (success() || failure()) && inputs.test == 'true' && steps.prettier.outputs.changes != 'true' && steps.audit.outputs.changes != 'true' && hashFiles('jest-results.json') != '' }}
      name: Publish Jest report
      # im-open/* is not in the ref-pin allowlist, so it is hash-pinned.
      uses: im-open/process-jest-test-results@3b73b8f2a22032eb329cfe08bc68d207cf8e626a # v3.0.0
      with:
        github-token: ${{ inputs.github-token }}
        results-file: jest-results.json
        report-name: Jest Tests
        create-pr-comment: true

    - if: ${{ always() }}
      name: Set quality outputs
      id: quality_outputs
      shell: bash
      env:
        PRETTIER_CHANGED: ${{ steps.prettier.outputs.changes }}
        AUDIT_CHANGED: ${{ steps.audit.outputs.changes }}
      run: |
        set -euo pipefail

        prettier_changed="${PRETTIER_CHANGED:-false}"
        audit_changed="${AUDIT_CHANGED:-false}"
        current_head_sha="$(git rev-parse HEAD)"

        {
          echo "prettier-changed=${prettier_changed}"
          echo "audit-changed=${audit_changed}"
          echo "current-head-sha=${current_head_sha}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## NPM pull request quality gate"
          echo ""
          echo "| Check | Value |"
          echo "|---|---:|"
          echo "| Prettier changed files | ${prettier_changed} |"
          echo "| npm audit changed lockfile | ${audit_changed} |"
          echo "| Current HEAD SHA | ${current_head_sha} |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"