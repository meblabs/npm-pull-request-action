version: 2
updates:
  # This repo is a composite action: only its own workflow/action `uses:`
  # pins are managed here. There is no package.json/lockfile, so no npm ecosystem.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # fix: so security bumps land as a fix and the latest major tag can be moved.
      prefix: "fix"
      prefix-development: "fix"
